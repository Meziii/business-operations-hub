[project]
name = "business-operations-hub-api"
version = "0.2.0"
description = "API du Business Operations Hub (données synthétiques)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "anthropic>=2.0",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ai" = ["eval/*.jsonl"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pypdfium2", "pytesseract"]  # pas de stubs publiés
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
